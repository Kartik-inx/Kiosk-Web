<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Explore the immersive 4K kiosk experience. A cinematic journey through historic locations.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Explore Kiosk Experience | 4K Cinematic Journey</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body oncontextmenu="return false;" style="background: #000;">

    <!-- IDLE SCREEN -->
    <div id="idle-screen" class="screen active">
        <video id="idle-video" src="assets/videos/attract.mp4" autoplay muted loop playsinline></video>
        <div class="idle-overlay"></div>
    </div>
    
    <!-- INTRO SCREEN -->
    <div id="intro-screen" class="screen hidden">
        <video id="intro-video" src="assets/videos/intro.mp4" playsinline muted></video>
    </div>

    <!-- MAP SCREEN -->
    <div id="map-screen" class="screen hidden">
        <div class="map-bg-layer"></div>
        <canvas id="map-lines-canvas"></canvas>
        <div class="hotspots-layer" id="hotspots-layer"></div>
    </div>

    <!-- VIDEO SCREEN -->
    <div id="video-screen" class="screen hidden">
        <div id="video-container"></div>
        <div class="video-overlay">
            <div class="video-header">
                <div class="video-close">✕ TAP ANYWHERE TO RETURN</div>
            </div>
            
            <div class="video-info-center">
                <div class="video-emoji-container">
                    <img class="video-icon" id="video-icon" src="" alt="icon">
                </div>
                <h2 id="video-title">Location Name</h2>
                <p id="video-desc">Explore this amazing destination</p>
            </div>
            
            <div class="video-progress-container">
                <div class="video-progress"><div class="video-progress-bar" id="video-progress-bar"></div></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
