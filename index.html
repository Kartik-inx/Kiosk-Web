<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Explore Kiosk Experience</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body oncontextmenu="return false;">

    <!-- IDLE SCREEN -->
    <div id="idle-screen" class="screen active">
        <div class="idle-overlay"></div>
        <canvas id="particles-canvas"></canvas>
        <div class="idle-rings">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
        </div>
        <div class="idle-content">
            <h1 class="hero-title">EXPLORE</h1>
            <p class="hero-sub">Touch Anywhere to Begin</p>
        </div>
        <div class="idle-border"></div>
    </div>

    <!-- WELCOME SCREEN -->
    <div id="welcome-screen" class="screen hidden">
        <canvas id="welcome-particles"></canvas>
        <div class="welcome-content">
            <div class="welcome-icon">
                <img src="assets/Hagia-Sophia.png" alt="Museum" class="welcome-logo">
            </div>
            <h1 class="welcome-title">Discover Your Destination</h1>
            <p class="welcome-subtitle">An Immersive Journey Awaits</p>
            <div class="welcome-loader"><div class="loader-bar"></div></div>
        </div>
    </div>

    <!-- MAP SCREEN -->
    <div id="map-screen" class="screen hidden">
        <div class="map-bg-layer">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
            <div class="animated-grid"></div>
        </div>
        <canvas id="map-lines-canvas"></canvas>
        <div class="hotspots-layer" id="hotspots-layer"></div>
    </div>

    <!-- VIDEO SCREEN -->
    <div id="video-screen" class="screen hidden">
        <div id="video-container"></div>
        <div class="video-overlay">
            <div class="video-header">
                <div class="video-close">✕ TAP ANYWHERE TO RETURN</div>
            </div>
            
            <div class="video-info-center">
                <div class="video-emoji-container">
                    <div class="video-emoji" id="video-emoji">🏛️</div>
                </div>
                <h2 id="video-title">Location Name</h2>
                <p id="video-desc">Explore this amazing destination</p>
            </div>
            
            <div class="video-progress-container">
                <div class="video-progress"><div class="video-progress-bar" id="video-progress-bar"></div></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
